{% extends "base.html" %}

{% block extra_head %}
<style>
    .container { max-width: 800px; }
    h1 { font-size: 3rem; margin-bottom: 40px; }
</style>
{% endblock %}

{% block content %}
<div class="text-center">
    <h1>Love Quiz Leaderboard</h1>
    
    <div class="leaderboard-list" id="lb-container">
        <!-- Populated via JS -->
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function updateLeaderboard() {
        try {
            const res = await fetch('/api/leaderboard');
            const data = await res.json();
            
            const container = document.getElementById('lb-container');
            container.innerHTML = '';
            
            if (data.couples.length === 0) {
                container.innerHTML = '<p class="text-muted mt-20">No couples have finished yet...</p>';
                return;
            }
            
            data.couples.forEach((couple, index) => {
                const row = document.createElement('div');
                row.className = 'lb-row';
                if (index === 0) row.classList.add('rank-first');
                else if (index === 1) row.classList.add('rank-second');
                else if (index === 2) row.classList.add('rank-third');
                
                let medal = `#${index + 1}`;
                if (index === 0) medal = '🥇';
                if (index === 1) medal = '🥈';
                if (index === 2) medal = '🥉';
                
                row.innerHTML = `
                    <div class="lb-rank">${medal}</div>
                    <div class="lb-names">${couple.partner_a_name} & ${couple.partner_b_name}</div>
                    <div class="lb-score">${Math.round(couple.love_score)}%</div>
                `;
                container.appendChild(row);
            });
        } catch(e) {}
    }
    
    updateLeaderboard();
    setInterval(updateLeaderboard, 4000);
</script>
{% endblock %}
